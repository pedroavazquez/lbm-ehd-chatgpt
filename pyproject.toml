[project]
name = "lbm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pedroavazquez", email = "pvazquez@us.es" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
markers = [
    "slow: numerical verification tests that take significantly longer to run",
]